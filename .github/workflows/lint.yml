name: Lint & Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Run ShellCheck on install.sh
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # v2.0.0
        with:
          scandir: .
          additional_files: install.sh

  markdown-lint:
    name: Markdown Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Lint Markdown files
        uses: DavidAnson/markdownlint-cli2-action@05f32210e84442804257b2a6f20b273450ec8265 # v19
        with:
          globs: |
            README.md
            README.pt.md
            CONTRIBUTING.md
            CHANGELOG.md
            SECURITY.md
            CODE_OF_CONDUCT.md
            docs/FAQ.md
            docs/FAQ.pt.md

  yaml-frontmatter:
    name: Validate YAML Frontmatter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Check SKILL files have valid frontmatter
        run: |
          ERRORS=0
          for file in SKILL.en.md SKILL.pt.md; do
            echo "Checking $file..."
            if ! head -1 "$file" | grep -q '^---'; then
              echo "ERROR: $file missing YAML frontmatter"
              ERRORS=$((ERRORS + 1))
            fi
            # Extract frontmatter and validate required fields
            FRONTMATTER=$(sed -n '1,/^---$/p' "$file" | tail -n +2 | head -n -1)
            for field in name description; do
              if ! echo "$FRONTMATTER" | grep -q "^${field}:"; then
                echo "ERROR: $file missing required field '$field'"
                ERRORS=$((ERRORS + 1))
              fi
            done
            echo "  OK"
          done
          if [ "$ERRORS" -gt 0 ]; then
            echo "FAILED: $ERRORS errors found"
            exit 1
          fi
          echo "All frontmatter valid"

  validate-examples:
    name: Validate Converted Examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Check converted examples have T1-T8 sections
        run: |
          ERRORS=0
          for file in examples/deep-agents-output/SKILL.md examples/deep-agents-output-2/SKILL.md examples/deep-agents-output-3/SKILL.md; do
            echo "Checking $file..."
            for section in "Execution Context" "Execution Plan" "Prerequisites" "Usage with Deep Agents" "Troubleshooting"; do
              if ! grep -q "$section" "$file"; then
                echo "  MISSING: '$section' in $file"
                ERRORS=$((ERRORS + 1))
              fi
            done
            # Check frontmatter
            if ! head -1 "$file" | grep -q '^---'; then
              echo "  MISSING: YAML frontmatter in $file"
              ERRORS=$((ERRORS + 1))
            fi
            # Check no stale references
            for old_ref in "CLAUDE.md" ".claude/"; do
              if grep -q "$old_ref" "$file"; then
                echo "  WARNING: Unconverted reference '$old_ref' in $file"
                ERRORS=$((ERRORS + 1))
              fi
            done
            echo "  OK"
          done
          if [ "$ERRORS" -gt 0 ]; then
            echo "FAILED: $ERRORS errors found"
            exit 1
          fi
          echo "All examples valid"
      - name: Validate Codex example with the conversion validator
        run: bash scripts/validate-conversion.sh --target codex examples/codex-output
      - name: Validate Cursor example with the conversion validator
        run: bash scripts/validate-conversion.sh --target cursor examples/cursor-output/python-fastapi-todo-app
      - name: Validate Qwen example with the conversion validator
        run: bash scripts/validate-conversion.sh --target qwen examples/qwen-output/python-fastapi-todo-app

  installer-syntax:
    name: Validate Installer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Check install.sh syntax
        run: bash -n install.sh
      - name: Check install.sh --help exits cleanly
        run: bash install.sh --help
      - name: Check install.sh rejects an invalid --target
        run: |
          if bash install.sh --target bogus >/dev/null 2>&1; then
            echo "ERROR: invalid --target was accepted"
            exit 1
          fi
          echo "OK: invalid --target rejected"

  lang-parity:
    name: EN/PT Parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Compare heading counts between EN and PT files
        run: |
          ERRORS=0
          check_pair() {
            en_count=$(grep -cE '^#{1,6} ' "$1")
            pt_count=$(grep -cE '^#{1,6} ' "$2")
            if [ "$en_count" -ne "$pt_count" ]; then
              echo "  MISMATCH: $1 has $en_count headings, $2 has $pt_count"
              ERRORS=$((ERRORS + 1))
            else
              echo "  OK: $1 / $2 ($en_count headings)"
            fi
          }
          check_pair SKILL.en.md SKILL.pt.md
          check_pair README.md README.pt.md
          if [ "$ERRORS" -gt 0 ]; then
            echo "FAILED: $ERRORS parity mismatch(es)"
            exit 1
          fi
          echo "EN/PT parity OK"

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Scan working tree for secrets with gitleaks
        run: |
          VERSION=8.21.2
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          ./gitleaks dir . --no-banner --redact --exit-code 1 --verbose
