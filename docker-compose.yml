services:
  # Scoras Chatbot API (Production with Azure Redis)
  chatbot:
    build: .
    ports:
      - "8000:8000"
    environment:
      # Azure AI Inference
      - AZURE_ENDPOINT=${AZURE_ENDPOINT}
      - AZURE_API_KEY=${AZURE_API_KEY}
      - AZURE_API_VERSION=${AZURE_API_VERSION:-2024-05-01-preview}
      - DEEPSEEK_MODEL=${DEEPSEEK_MODEL:-DeepSeek-V3-0324}
      
      # Azure Redis (production)
      - REDIS_URL=${REDIS_URL}
      
      # Qdrant
      - QDRANT_URL=${QDRANT_URL:-http://qdrant:6333}
      
      # Calendly
      - CALENDLY_LINK=${CALENDLY_LINK:-https://calendly.com/scoras/reuniao}
      
      # Environment
      - ENVIRONMENT=${ENVIRONMENT:-production}
    
    profiles:
      - production

  # Scoras Chatbot API (Development with Local Redis)
  chatbot-dev:
    build: .
    ports:
      - "8000:8000"
    environment:
      # Azure AI Inference
      - AZURE_ENDPOINT=${AZURE_ENDPOINT}
      - AZURE_API_KEY=${AZURE_API_KEY}
      - AZURE_API_VERSION=${AZURE_API_VERSION:-2024-05-01-preview}
      - DEEPSEEK_MODEL=${DEEPSEEK_MODEL:-DeepSeek-V3-0324}
      
      # Local Redis
      - REDIS_URL=redis://redis:6379/0
      
      # Local Qdrant
      - QDRANT_URL=http://qdrant:6333
      
      # Calendly
      - CALENDLY_LINK=${CALENDLY_LINK:-https://calendly.com/scoras/reuniao}
      
      # Environment
      - ENVIRONMENT=development
    
    depends_on:
      - redis
      - qdrant
    
    profiles:
      - local
    
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Redis Stack (for local development - includes search modules)
  redis:
    image: redis/redis-stack:latest
    ports:
      - "6379:6379"
      - "8001:8001"  # RedisInsight UI
    volumes:
      - redis_data:/data
    profiles:
      - local

  # Qdrant Vector Database
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__HTTP_PORT=6333

volumes:
  redis_data:
  qdrant_data: 